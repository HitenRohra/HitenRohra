name: refresh stats

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:          # deliberately no `push` — this job commits, and
                              # a push trigger would re-run it on its own commit

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Standard library only — nothing to install, nothing to break in CI.
      # The built-in GITHUB_TOKEN returns the same numbers a personal token
      # would; the GraphQL query is pinned to public repos either way.
      - name: draw the graphics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/generate_stats.py

      # Commit only on change, or this lands a commit every single night.
      - name: commit what changed
        run: |
          FILES="stats.svg streak.svg langs.svg year.svg hd-*.svg"
          [ -z "$(git status --porcelain -- $FILES)" ] && exit 0
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $FILES && git commit -m "stats: refresh" && git push
